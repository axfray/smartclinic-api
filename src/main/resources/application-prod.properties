# ===== Perfil de producción =====
# Sin valores por defecto en secretos: si falta una variable de entorno, la app no arranca.
# DB_URL es la URL JDBC completa. Si no está, DATABASE_URL (formato Render: postgresql://...)
# se convierte a JDBC en DatabaseUrlEnvironmentPostProcessor.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Usuario administrador inicial
admin.email=${ADMIN_EMAIL}
admin.password=${ADMIN_PASSWORD}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Proxy inverso del PaaS (respeta X-Forwarded-Proto/Host/Port)
server.forward-headers-strategy=framework

# Swagger deshabilitado en producción
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
