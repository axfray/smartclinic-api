# ===== Perfil de desarrollo (local) =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/smartclinic_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT (valor solo para desarrollo local; en producción se define por entorno)
jwt.secret=${JWT_SECRET:clave-solo-para-desarrollo-local-cambiar-en-prod-0123456789}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Usuario administrador inicial
admin.email=${ADMIN_EMAIL:admin@smartclinic.local}
admin.password=${ADMIN_PASSWORD:admin123}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
